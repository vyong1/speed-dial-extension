<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Tab</title>
    <link rel="stylesheet" href="colors.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="/favicon.png">
  </head>
  <body data-theme="dark" data-dial-size="medium">
    <main class="page">
      <header class="page-header">
        <div class="header-actions">
          <button id="editModeButton" class="edit-mode-button" type="button" aria-pressed="false" title="Enter edit mode">
            <span aria-hidden="true">&#9998;</span>
            <span class="edit-mode-label">Edit</span>
          </button>
          <div id="menu" class="menu">
            <button id="menuButton" class="menu-button" type="button" aria-label="Open menu" aria-haspopup="menu" aria-expanded="false">
              <span aria-hidden="true">&#9776;</span>
            </button>
            <div id="menuDropdown" class="menu-dropdown" role="menu" hidden>
              <div class="menu-theme-control" role="none">
                <span>Theme</span>
                <div id="themeButtons" class="theme-buttons" role="group" aria-label="Theme">
                  <button class="theme-option" type="button" data-theme="dark" aria-label="Dark theme" title="Dark"></button>
                  <button class="theme-option" type="button" data-theme="light" aria-label="Light theme" title="Light"></button>
                  <button class="theme-option" type="button" data-theme="blue" aria-label="Blue theme" title="Blue"></button>
                  <button class="theme-option" type="button" data-theme="pink" aria-label="Pink theme" title="Pink"></button>
                  <button class="theme-option" type="button" data-theme="sepia" aria-label="Sepia theme" title="Sepia"></button>
                </div>
              </div>
              <div class="menu-size-control" role="none">
                <span>Dial size</span>
                <div id="dialSizeButtons" class="dial-size-buttons" role="radiogroup" aria-label="Dial size">
                  <button class="dial-size-button" type="button" role="radio" data-size="small" aria-label="Small dial size">S</button>
                  <button class="dial-size-button" type="button" role="radio" data-size="medium" aria-label="Medium dial size">M</button>
                  <button class="dial-size-button" type="button" role="radio" data-size="large" aria-label="Large dial size">L</button>
                </div>
              </div>
              <hr/>
              <h3>Background</h3>
              <button id="backgroundImageButton" class="menu-item" type="button" role="menuitem">Upload</button>
              <button id="removeBackgroundButton" class="menu-item" type="button" role="menuitem" disabled>Delete</button>
              <button id="toggleBackgroundButton" class="menu-item" type="button" role="menuitem" disabled title="Hide background without deleting">Hide</button>
              <p id="backgroundImageStatus" class="menu-status" role="status" aria-live="polite"></p>
              <hr/>
              <button id="importButton" class="menu-item" type="button" role="menuitem">Import</button>
              <button id="exportButton" class="menu-item" type="button" role="menuitem">Export</button>
            </div>
          </div>
          <input id="importInput" type="file" accept=".json,application/json" hidden>
          <input id="backgroundImageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
        </div>
      </header>

      <section id="dialGrid" class="dial-grid" aria-label="Speed dials">
        <button id="addButton" class="add-button" type="button" aria-label="Add a speed dial">
          <span aria-hidden="true">+</span>
        </button>
      </section>
    </main>

    <div id="dialogBackdrop" class="dialog-backdrop" hidden>
      <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <h2 id="dialogTitle">Add speed dial</h2>
        <form id="dialForm">
          <label for="urlInput">Web Address</label>
          <input id="urlInput" name="url" type="text" inputmode="url" required placeholder="https://example.com">

          <label for="nameInput">Name (optional)</label>
          <input id="nameInput" name="name" type="text" maxlength="40" placeholder="example">

          <label for="iconUrlInput">Icon URL (optional)</label>
          <div class="input-with-action">
            <input id="iconUrlInput" name="iconUrl" type="url" placeholder="https://example.com/icon.png">
            <button id="logoLookupButton" class="logo-lookup-button" type="button" aria-label="Look up logo" title="Look up logo" hidden>
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <circle cx="10.8" cy="10.8" r="6.3"></circle>
                <path d="m15.5 15.5 5 5"></path>
              </svg>
            </button>
          </div>

          <label for="iconFileInput">Or upload an icon (optional)</label>
          <input id="iconFileInput" name="iconFile" type="file" accept="image/png,image/jpeg,image/gif,image/svg+xml,image/webp">

          <p id="formError" class="form-error" role="alert"></p>

          <div class="dialog-actions">
            <button id="cancelButton" class="secondary-button" type="button">Cancel</button>
            <button class="primary-button" type="submit">Add</button>
          </div>
        </form>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
